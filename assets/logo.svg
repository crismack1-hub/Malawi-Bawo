<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Malawi Bao logo</title>
  <desc id="desc">A stylised wooden Bao board with two rows of pits and golden seeds.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a120b"/>
      <stop offset="100%" stop-color="#0d0a06"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3f1f"/>
      <stop offset="60%" stop-color="#4a2710"/>
      <stop offset="100%" stop-color="#2d180a"/>
    </linearGradient>
    <radialGradient id="pit" cx="50%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#2a160a"/>
      <stop offset="70%" stop-color="#160a04"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </radialGradient>
    <radialGradient id="seed" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fde0a3"/>
      <stop offset="55%" stop-color="#f5b54a"/>
      <stop offset="100%" stop-color="#a35f15"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- warm glow behind board -->
  <ellipse cx="256" cy="270" rx="232" ry="120" fill="#f5b54a" opacity="0.07"/>

  <!-- board slab -->
  <g>
    <rect x="56" y="140" width="400" height="232" rx="38" fill="url(#board)"/>
    <rect x="56" y="140" width="400" height="232" rx="38" fill="url(#rim)"/>
    <rect x="56" y="140" width="400" height="232" rx="38" fill="none" stroke="#1a0f06" stroke-width="6"/>
  </g>

  <!-- pits: 2 rows × 4 -->
  <g>
    <circle cx="116" cy="216" r="38" fill="url(#pit)"/>
    <circle cx="210" cy="216" r="38" fill="url(#pit)"/>
    <circle cx="302" cy="216" r="38" fill="url(#pit)"/>
    <circle cx="396" cy="216" r="38" fill="url(#pit)"/>

    <circle cx="116" cy="296" r="38" fill="url(#pit)"/>
    <circle cx="210" cy="296" r="38" fill="url(#pit)"/>
    <circle cx="302" cy="296" r="38" fill="url(#pit)"/>
    <circle cx="396" cy="296" r="38" fill="url(#pit)"/>
  </g>

  <!-- subtle highlight ring around the pits to suggest depth -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <circle cx="116" cy="216" r="36"/>
    <circle cx="210" cy="216" r="36"/>
    <circle cx="302" cy="216" r="36"/>
    <circle cx="396" cy="216" r="36"/>
    <circle cx="116" cy="296" r="36"/>
    <circle cx="210" cy="296" r="36"/>
    <circle cx="302" cy="296" r="36"/>
    <circle cx="396" cy="296" r="36"/>
  </g>

  <!-- seeds (selectively placed for a clean composition) -->
  <g>
    <!-- top row: a few seeds -->
    <circle cx="200" cy="206" r="10" fill="url(#seed)"/>
    <circle cx="220" cy="222" r="10" fill="url(#seed)"/>

    <circle cx="294" cy="208" r="10" fill="url(#seed)"/>
    <circle cx="310" cy="226" r="10" fill="url(#seed)"/>

    <!-- bottom row: a few seeds -->
    <circle cx="108" cy="288" r="10" fill="url(#seed)"/>
    <circle cx="124" cy="306" r="10" fill="url(#seed)"/>

    <circle cx="388" cy="288" r="10" fill="url(#seed)"/>
    <circle cx="404" cy="306" r="10" fill="url(#seed)"/>
  </g>

  <!-- small accent dot top-right (visual anchor) -->
  <circle cx="440" cy="92" r="8" fill="#f5b54a" opacity="0.85"/>
</svg>
